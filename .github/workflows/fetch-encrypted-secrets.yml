name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: true
        type: string

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Download with Retry
        uses: nick-fields/retry@v3
        env:
          RDGEN_CALLBACK_TOKEN: ${{ secrets.RDGEN_CALLBACK_TOKEN }}
          RDGEN_ZIP_URL: ${{ secrets.RDGEN_ZIP_URL }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: python
          command: |
            import os
            import requests
            import json
            import time
            from urllib.parse import urlsplit

            input_data = json.loads('${{ inputs.zip_url_json }}')
            callback_token = os.environ.get("RDGEN_CALLBACK_TOKEN", "")
            direct_url = os.environ.get("RDGEN_ZIP_URL", "").strip()
            if direct_url:
                parsed = urlsplit(direct_url)
                if (parsed.scheme != 'https' or parsed.hostname != 'usc1.contabostorage.com'
                        or not parsed.path.startswith('/software/hynit-remote-support/config/')):
                    raise ValueError('RDGEN_ZIP_URL must be a presigned Contabo URL in the HYNIT config prefix')
                url = direct_url
                request_headers = {}
                print('Download source: Contabo S3')
            else:
                url = f"{input_data['url']}/get_zip?filename={input_data['file']}"
                request_headers = {"X-RDGen-Callback-Token": callback_token}
                print('Download source: RDGen')
            print(f"Callback token present: {bool(callback_token)}")
            
            for attempt in range(5):
                try:
                    print(f"Downloading (Attempt {attempt + 1})...")
                    r = requests.get(
                        url,
                        headers=request_headers,
                        timeout=20,
                    )
                    if r.status_code >= 400:
                        print("Download response:", r.status_code, {
                            key: r.headers.get(key) for key in ("Server", "CF-Ray", "CF-Mitigated", "Content-Type")
                        })
                    r.raise_for_status()
                    with open('secrets.zip', 'wb') as f:
                        f.write(r.content)
                    break
                except Exception as e:
                    if attempt < 4:
                        time.sleep(5 * (2 ** attempt))
                    else: raise e

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
